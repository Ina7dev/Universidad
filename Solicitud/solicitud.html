<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="solicitud.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="contenedor_header">
            <img src="src/logojueee.png" id="logo"/>
        </div>

        <div class="contenedor_header">
            <img src="src/JueeeTitulo.png" id="jueeelogo"/>
        </div>


        <div id="botones">
        
            <button class="boton" href="#" onclick="alert('Hacer que estos botones redirijan')">Inicio</button>

            <a class="boton" href="#" onclick="alert('Hacer que estos botones redirijan')">Ingresar</a>
        
        </div>

        <li id="icono_ingresar">
            <span class="fa fa-user"></span>
        </li>

    </header>
        <div class="container-general">
            <div class="container-login">

                <form id="register">
                    <h2>Solicitud</h2>
                    <div class="container-nc">
                        <div class="container-name">

                            <label for="name">Nombre Completo:</label>
                            <input type="text" id="name" required>

                        </div>
                        <div class="container-email">
                            <label for="email">Correo Electronico:</label>
                            <input type="text" id="email" required>
                        </div>
                    </div>

                    <div class="container-ds">

                        <label for="ds">Descripción:</label>
                        <textarea type="text" id="description" name="description" rows="5" required></textarea>

                    </div>
                    <div class="fotos">

                        <form id="uploadForm">
                            <label for="imageUpload">Subir fotos:</label>
                            <input type="file" id="imageUpload" name="imageUpload" accept="image/*" required>
                            <input class="boton-1" type="submit" value="Enviar">
                        </form>
                    </div>
                </form>

            </div>
        </div>
</body>
</html>
